name: CI

# Pull requests run only the test layers the change can affect (see ci/test_map.yaml).
# Pushes to main, the nightly schedule and manual runs always run everything.
# Add the label `run-all-tests` to a pull request to force a full run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels the older run of that PR. Runs on main (merges, manual, nightly) are never
# cancelled: each one is a result we want, and the health history needs it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runners are pinned (not ubuntu-latest) so a new Ubuntu image never changes the emulator or Android SDK under us
# unannounced; bump them on purpose.
jobs:
  select:
    name: Select tests
    runs-on: ubuntu-24.04
    outputs:
      layers: ${{ steps.select.outputs.layers }}
      backend: ${{ steps.select.outputs.backend }}
      backend_markers: ${{ steps.select.outputs.backend_markers }}
      mobile: ${{ steps.select.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python -m ci.select_tests --base "$BASE_SHA" --head "$HEAD_SHA"

  backend:
    name: Backend (${{ needs.select.outputs.backend_markers }})
    needs: select
    if: needs.select.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the selected layers
        env:
          MARKERS: ${{ needs.select.outputs.backend_markers }}
        # A failed test is retried once. One that then passes is reported as flaky, never as a plain pass.
        run: >-
          python -m pytest -m "$MARKERS" -v --reruns 1 --reruns-delay 1
          --junitxml=junit-backend.xml --results-json=results-backend.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-junit
          path: |
            junit-backend.xml
            results-backend.json

  mobile:
    name: Emulator tests
    needs: select
    if: needs.select.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install test dependencies and Appium
        run: |
          pip install -r requirements-dev.txt
          npm install -g appium
          appium driver install uiautomator2

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run the emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: ./ci/run_e2e.sh

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore

  # When a backend or emulator test fails on a pull request, a bot reads the failure, diagnoses it, tries its
  # suggested fix in a scratch copy and comments. It never pushes or merges. See docs/triage.md.
  triage:
    name: Failure triage
    needs: [select, backend, mobile]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.backend.result == 'failure' || needs.mobile.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v8
        with:
          path: results
          pattern: "*"
      - name: Diagnose the failures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -m triage
          --junit backend=results/backend-junit/junit-backend.xml e2e=results/e2e-artifacts/junit.xml
          --artifacts results/e2e-artifacts --base "$BASE_SHA" --head HEAD
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -s triage-report.md ]; then
            gh pr comment "$PR_NUMBER" --body-file triage-report.md --edit-last --create-if-none
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: triage-results
          path: |
            triage-results.json
            triage-report.md
          if-no-files-found: ignore

  # Records every run in health.json on the `ci-health` branch and, on the nightly run, opens a pull request that
  # quarantines tests which keep flaking. See docs/flaky-tests.md.
  health:
    name: Test health
    needs: [select, backend, mobile]
    # a cancelled test job leaves partial results, which must not be recorded as a run
    if: always() && github.event_name != 'pull_request' && needs.backend.result != 'cancelled' && needs.mobile.result != 'cancelled'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-health
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v8
        with:
          path: results
          pattern: "*"
      - name: Fetch the recorded history
        run: |
          if git ls-remote --exit-code --heads origin ci-health > /dev/null; then
            git fetch --depth=1 origin ci-health
            git show FETCH_HEAD:health.json > health.json
          else
            echo '{}' > health.json
          fi
      - name: Record this run
        run: |
          python -m ci.health update --health health.json --run-id "$GITHUB_RUN_ID" \
            --results results/backend-junit/results-backend.json results/e2e-artifacts/results-e2e.json
          python -m ci.health report --health health.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Propose quarantining tests that keep flaking
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true   # needs "Allow GitHub Actions to create pull requests" in the repository settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ci.health quarantine --health health.json --file quarantine.yaml | tee quarantine-change.json
          OPEN=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/quarantine-"))] | length')
          if [ "$OPEN" != "0" ]; then
            echo "A quarantine pull request is already open; not opening another."
          elif [ -n "$(git status --porcelain quarantine.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            BRANCH="bot/quarantine-$GITHUB_RUN_ID"
            git checkout -q -b "$BRANCH"
            git add quarantine.yaml
            git commit -qm "Update the test quarantine"
            git push -q origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Update the test quarantine" \
              --body "Proposed by the nightly health job: $(cat quarantine-change.json). Quarantined tests still run but no longer block merges. Review before merging."
          fi
      - name: Save the history
        run: ci/publish_health.sh health.json

  # One stable name for branch protection: green when every job that had to run passed.
  # Skipped jobs (layers not selected) count as fine; failed or cancelled ones do not.
  result:
    name: CI result
    needs: [select, backend, mobile]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A required job did not pass"; exit 1 ;;
          esac
